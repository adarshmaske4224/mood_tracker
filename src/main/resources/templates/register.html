<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration — Campus MindTrack</title>
    <meta name="description" content="Register as a student to start tracking your daily mood and stress levels on campus.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🎓</div>
            <h1>Campus Registration</h1>
            <p>Join the student mental wellness community</p>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-error">
            ⚠️ <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" class="form-input"
                       placeholder="e.g. Adarsh Sharma" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="rollNumber">Roll Number</label>
                <input type="text" id="rollNumber" name="rollNumber" class="form-input"
                       placeholder="e.g. 21CS104" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="departmentId">Department</label>
                <select id="departmentId" name="departmentId" class="form-select" required>
                    <option value="">— Select Department —</option>
                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="reg-username">Username</label>
                <input type="text" id="reg-username" name="username" class="form-input"
                       placeholder="Choose a login username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" class="form-input"
                       placeholder="Create a password" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">
                ✨ Create Student Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already registered? <a th:href="@{/login}">Sign in here</a></p>
        </div>
    </div>
</div>
</body>
</html>
